name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:desktop-security
      - run: npm run check:release
      - run: npm test
      - name: Reject an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists and is immutable"
            exit 1
          fi

  package-windows:
    name: Windows Portable
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build without publishing
        run: npm run desktop:dist:win -- --publish never
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "release/Motif-*-Portable.exe" -File -ErrorAction SilentlyContinue)) { throw "Missing portable executable" }
          Write-Host "::notice::Windows artifacts are intentionally published without Authenticode signing"
      - name: Smoke unpacked app
        run: npm run desktop:smoke
        env:
          MOTIF_DISABLE_UPDATER: "1"
          MOTIF_SMOKE_USER_DATA: ${{ runner.temp }}\motif-smoke-unpacked
      - name: Smoke portable app
        shell: pwsh
        run: |
          $env:MOTIF_EXECUTABLE = (Get-ChildItem release/Motif-*-Portable.exe).FullName
          $env:MOTIF_SMOKE_USER_DATA = Join-Path $env:RUNNER_TEMP "motif-smoke-portable"
          npm run desktop:smoke
      - name: Generate final checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/Motif-*-Portable.exe -File
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: motif-windows
          if-no-files-found: error
          path: |
            release/*-Portable.exe
            release/SHA256SUMS-windows.txt

  package-macos:
    name: Signed macOS DMGs
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require signing and notarization inputs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.MAC_CSC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::${name} is required"; exit 1; }
          done
      - name: Build signed and notarized artifacts without publishing
        run: npm run desktop:dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.MAC_CSC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Notarize and staple DMGs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          found=0
          for dmg in release/*.dmg; do
            [ -f "$dmg" ] || continue
            found=1
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done
          [ "$found" -eq 1 ] || { echo "::error::No DMGs found"; exit 1; }
      - name: Verify signing, notarization, and artifacts
        run: |
          found=0
          for app in release/mac*/Motif.app; do
            [ -d "$app" ] || continue
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type exec "$app"
            xcrun stapler validate "$app"
          done
          [ "$found" -eq 1 ] || { echo "::error::No Motif.app bundles found"; exit 1; }
          for dmg in release/*.dmg; do xcrun stapler validate "$dmg"; done
          for pattern in "release/*.dmg" "release/*.zip" "release/latest-mac.yml"; do
            compgen -G "$pattern" >/dev/null || { echo "::error::Missing $pattern"; exit 1; }
          done
      - name: Smoke universal packaged app
        run: MOTIF_EXECUTABLE="release/mac-universal/Motif.app/Contents/MacOS/Motif" MOTIF_SMOKE_USER_DATA="$RUNNER_TEMP/motif-smoke-mac-universal" npm run desktop:smoke
      - name: Smoke universal DMG on arm64
        run: |
          dmg=$(compgen -G "release/Motif-*-universal.dmg")
          [ -f "$dmg" ] || { echo "::error::Missing universal DMG"; exit 1; }
          mount="$RUNNER_TEMP/motif-dmg-universal"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          cp -R "$mount/Motif.app" "$RUNNER_TEMP/Motif-universal.app"
          hdiutil detach "$mount"
          MOTIF_EXECUTABLE="$RUNNER_TEMP/Motif-universal.app/Contents/MacOS/Motif" MOTIF_SMOKE_USER_DATA="$RUNNER_TEMP/motif-smoke-dmg-universal-arm64" npm run desktop:smoke
      - name: Generate final checksums
        run: |
          : > release/SHA256SUMS-macos.txt
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'latest*.yml' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#release/##' >> release/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v7
        with:
          name: motif-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt

  smoke-macos-intel:
    name: Native Intel macOS Smoke
    needs: package-macos
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: motif-macos
          path: release
      - name: Verify and smoke universal DMG on Intel
        run: |
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::Intel smoke requires an x86_64 runner"; exit 1; }
          dmg=$(compgen -G "release/Motif-*-universal.dmg")
          [ -f "$dmg" ] || { echo "::error::Missing universal DMG"; exit 1; }
          xcrun stapler validate "$dmg"
          mount="$RUNNER_TEMP/motif-dmg-universal-intel"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          cp -R "$mount/Motif.app" "$RUNNER_TEMP/Motif-universal.app"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Motif-universal.app"
          spctl --assess --verbose --type exec "$RUNNER_TEMP/Motif-universal.app"
          MOTIF_EXECUTABLE="$RUNNER_TEMP/Motif-universal.app/Contents/MacOS/Motif" MOTIF_SMOKE_USER_DATA="$RUNNER_TEMP/motif-smoke-dmg-universal-intel" npm run desktop:smoke

  publish:
    name: Publish Complete Immutable Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-macos, smoke-macos-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: motif-windows
          path: release/windows
      - uses: actions/download-artifact@v8
        with:
          name: motif-macos
          path: release/macos
      - name: Verify final artifact set
        run: node scripts/verify-release-artifacts.mjs release
      - name: Recheck immutable release boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists and will not be changed"
            exit 1
          fi
      - name: Publish once
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/windows/Motif-*-Portable.exe
            release/windows/SHA256SUMS-windows.txt
            release/macos/Motif-*-universal.dmg
            release/macos/Motif-*-universal.zip
            release/macos/latest-mac.yml
