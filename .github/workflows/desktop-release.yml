name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:desktop-security
      - run: npm run check:release
      - run: npm test
      - name: Reject an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists and is immutable"
            exit 1
          fi

  package-windows:
    name: Windows Installer and Portable
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require Authenticode for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CODESIGN_CERTIFICATE and WINDOWS_CODESIGN_PASSWORD are required for tagged releases"
          }
      - name: Build without publishing
        run: npm run desktop:dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      - name: Verify artifacts and tagged signatures
        shell: pwsh
        run: |
          $patterns = @("release/Motif-*-Setup.exe", "release/Motif-*-Portable.exe", "release/Motif-*-win.zip", "release/latest.yml")
          foreach ($pattern in $patterns) {
            if (-not (Get-ChildItem $pattern -File -ErrorAction SilentlyContinue)) { throw "Missing required artifact: $pattern" }
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            Get-ChildItem release/*.exe | ForEach-Object {
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
              if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature on $($_.Name): $($signature.Status)" }
            }
          }
      - name: Smoke unpacked app
        run: npm run desktop:smoke
        env:
          MOTIF_DISABLE_UPDATER: "1"
          MOTIF_SMOKE_USER_DATA: ${{ runner.temp }}\motif-smoke-unpacked
      - name: Smoke installed app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/Motif-*-Setup.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP "motif-installed"
          Start-Process -FilePath $setup -ArgumentList "/S", "/D=$install" -Wait
          $env:MOTIF_EXECUTABLE = Join-Path $install "Motif.exe"
          $env:MOTIF_SMOKE_USER_DATA = Join-Path $env:RUNNER_TEMP "motif-smoke-installed"
          npm run desktop:smoke
      - name: Smoke portable app
        shell: pwsh
        run: |
          $env:MOTIF_EXECUTABLE = (Get-ChildItem release/Motif-*-Portable.exe).FullName
          $env:MOTIF_SMOKE_USER_DATA = Join-Path $env:RUNNER_TEMP "motif-smoke-portable"
          npm run desktop:smoke
      - name: Generate final checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in ".exe", ".zip", ".blockmap", ".yml" } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $lines | Set-Content release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: motif-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt

  package-macos:
    name: Signed macOS DMGs
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require signing and notarization inputs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.MAC_CSC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::${name} is required"; exit 1; }
          done
      - name: Build signed and notarized artifacts without publishing
        run: npm run desktop:dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.MAC_CSC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signing, notarization, and artifacts
        run: |
          found=0
          for app in release/mac*/Motif.app; do
            [ -d "$app" ] || continue
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type exec "$app"
            xcrun stapler validate "$app"
          done
          [ "$found" -eq 1 ] || { echo "::error::No Motif.app bundles found"; exit 1; }
          for dmg in release/*.dmg; do xcrun stapler validate "$dmg"; done
          for pattern in "release/*.dmg" "release/*.zip" "release/latest-mac.yml"; do
            compgen -G "$pattern" >/dev/null || { echo "::error::Missing $pattern"; exit 1; }
          done
      - name: Smoke packaged apps
        run: |
          index=0
          for executable in release/mac*/Motif.app/Contents/MacOS/Motif; do
            [ -x "$executable" ] || continue
            MOTIF_EXECUTABLE="$executable" MOTIF_SMOKE_USER_DATA="$RUNNER_TEMP/motif-smoke-mac-$index" npm run desktop:smoke
            index=$((index + 1))
          done
      - name: Smoke DMGs
        run: |
          index=0
          for dmg in release/*.dmg; do
            mount="$RUNNER_TEMP/motif-dmg-$index"
            mkdir -p "$mount"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
            cp -R "$mount/Motif.app" "$RUNNER_TEMP/Motif-$index.app"
            hdiutil detach "$mount"
            MOTIF_EXECUTABLE="$RUNNER_TEMP/Motif-$index.app/Contents/MacOS/Motif" MOTIF_SMOKE_USER_DATA="$RUNNER_TEMP/motif-smoke-dmg-$index" npm run desktop:smoke
            index=$((index + 1))
          done
      - name: Generate final checksums
        run: |
          : > release/SHA256SUMS-macos.txt
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#release/##' >> release/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v7
        with:
          name: motif-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt

  publish:
    name: Publish Complete Immutable Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: motif-windows
          path: release/windows
      - uses: actions/download-artifact@v8
        with:
          name: motif-macos
          path: release/macos
      - name: Verify final artifact set
        run: node scripts/verify-release-artifacts.mjs release
      - name: Recheck immutable release boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists and will not be changed"
            exit 1
          fi
      - name: Publish once
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/windows/*
            release/macos/*
